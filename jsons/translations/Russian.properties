# Фракции и лидеры
Continental Magic Association = Континентальная магическая ассоциация
Serie = Зерие
Mage = Маг
Magic is the privilege of the strong. Let us see what you are capable of. = Магия — привилегия сильных. Посмотрим, на что ты способен.
Foolishness. You challenge the pinnacle of magic. = Глупость. Ты бросаешь вызов вершине магии.
An unexpected outcome... Perhaps this era truly belongs to humans. = Неожиданный исход... Возможно, эта эпоха и вправду принадлежит людям.
I am Serie, founder of the Continental Magic Association. Do you possess the ambition to grasp true magic? = Я Зерие, основательница Континентальной магической ассоциации. Хватит ли у тебя амбиций постичь истинную магию?
Speak quickly. My time is precious. = Говори быстрее. Моё время дорого.
Your mana is repulsive. = Твоя мана отвратительна.
An exchange of grimoires and resources? Let us hear it. = Обмен гримуарами и ресурсами? Что ж, выслушаю.

Demon King Army = Армия Короля Демонов
Macht of El Dorado = Махт из Эльдорадо
Demon = Демон
I wish to understand human malice and coexistence. Die for my experiment. = Я хочу постичь человеческую злобу и сосуществование. Умри ради моего эксперимента.
Curse of Gold will turn your lands into eternal statues. = Проклятие золота обратит твои земли в вечные статуи.
So this is... defeat. Still, I do not comprehend human emotions. = Так вот что такое... поражение. Я всё равно не понимаю человеческих эмоций.
I am Macht, one of the Seven Sages of Destruction. Humans and demons cannot coexist, yet I still seek to understand you. = Я Махт, один из Семи мудрецов разрушения. Люди и демоны не могут сосуществовать, но я всё ещё пытаюсь вас понять.
State your purpose, human. = Назови свою цель, человек.
You will become golden dust. = Ты станешь золотой пылью.
Even demons understand the value of a temporary truce. = Даже демоны понимают ценность временного перемирия.

